<!DOCTYPE html> 
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D戦略型領地島支配ゲーム</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
    canvas { display: block; }
    #ui-container { position: absolute; bottom: 20px; right: 20px; width: 220px; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    .status-bar-container { background: rgba(0,0,0,0.6); padding: 6px 10px; border-radius: 6px; color: white; font-size: 12px; font-weight: bold; }
    .bar-bg { width: 100%; height: 12px; background: #444; border-radius: 4px; overflow: hidden; margin-top: 4px; }
    .bar-fill { height: 100%; width: 100%; transition: width 0.1s ease; }
    #hp-bar { background: #e74c3c; }
    #thirst-val-bar { background: #3498db; }
    #hunger-bar { background: #f39c12; }
    #location-ui { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); color: white; padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: bold; border: 1px solid rgba(255,255,255,0.2); pointer-events: none; }
    #view-mode-ui { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.7); color: white; padding: 8px 14px; border-radius: 8px; font-size: 12px; pointer-events: none; }
    #hotbar-container { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); pointer-events: none; }
    .hotbar-slot { width: 60px; height: 60px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-size: 11px; font-weight: bold; position: relative; text-align: center; padding: 2px; box-sizing: border-box; }
    .hotbar-slot.active { border-color: #f1c40f; background: rgba(241,196,15,0.2); box-shadow: 0 0 10px rgba(241,196,15,0.5); }
    .hotbar-key { position: absolute; top: 3px; left: 5px; font-size: 10px; color: #aaa; }
    #interact-prompt { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.75); border: 1px solid rgba(255,255,255,0.4); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: bold; pointer-events: none; display: none; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
    #inventory-modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(950px, 92vw); height: min(580px, 86vh); background: rgba(15,15,18,0.95); border: 2px solid #555; border-radius: 12px; padding: 28px; color: white; display: none; box-shadow: 0 0 30px rgba(0,0,0,0.85); box-sizing: border-box; z-index: 10; }
    #inventory-modal.active { display: flex; gap: 28px; }
    .panel { flex: 1; display: flex; flex-direction: column; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 20px; min-width: 0; }
    .panel-title { font-size: 18px; font-weight: bold; letter-spacing: 1px; margin-bottom: 16px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 12px; color: #f0f0f0; }
    .inventory-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
    .inventory-slot { aspect-ratio: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; text-align: center; color: #eee; transition: border-color 0.2s, background-color 0.2s; cursor: grab; position: relative; padding: 4px; box-sizing: border-box; word-break: break-word; white-space: pre-line; }
    .inventory-slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; image-rendering: auto; pointer-events: none; }
    .inventory-name { position: absolute; left: 4px; right: 30px; bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 1px 3px; border-radius: 3px; background: rgba(0,0,0,0.65); font-size: 10px; line-height: 1.1; z-index: 1; }
    .inventory-count { position: absolute; right: 5px; bottom: 3px; padding: 1px 3px; border-radius: 3px; background: rgba(0,0,0,0.65); color: #fff; font-size: 12px; line-height: 1.1; }
    .inventory-slot:hover { border-color: #3498db; background: rgba(52,152,219,0.2); }
    .inventory-slot.drag-over { border-color: #2ecc71; background: rgba(46,204,113,0.3); }
    .inventory-slot.hotbar-linked { border-bottom: 3px solid #f1c40f; }
    .craft-list { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding-right: 6px; max-height: 440px; }
    .craft-list::-webkit-scrollbar { width: 6px; }
    .craft-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
    .craft-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 10px 14px; }
    .craft-info { display: flex; flex-direction: column; gap: 4px; }
    .craft-name { font-size: 14px; font-weight: bold; color: #fff; }
    .craft-cost { font-size: 11px; color: #bbb; }
    .craft-btn { background: #27ae60; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; transition: background 0.2s, opacity 0.2s; white-space: nowrap; }
    .craft-btn:hover:not(:disabled) { background: #2ecc71; }
    .craft-btn:disabled { background: #555; color: #888; cursor: not-allowed; opacity: 0.6; }
    #map-modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(700px, 92vw); height: min(700px, 92vh); background: rgba(10,10,14,0.95); border: 2px solid #555; border-radius: 12px; padding: 16px; box-sizing: border-box; display: none; z-index: 10; box-shadow: 0 0 30px rgba(0,0,0,0.85); }
    #map-modal.active { display: block; }
    #map-title { color: #fff; text-align: center; font-weight: bold; margin-bottom: 8px; letter-spacing: 1px; }
    #map-canvas { display: block; width: 100%; height: calc(100% - 32px); background: #0d3b66; border-radius: 8px; }
    #start-screen { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at top, rgba(56,135,255,0.28), rgba(6,12,20,0.92)); backdrop-filter: blur(4px); }
    #start-screen.hidden { display: none; }
    #loading-screen { position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center; background: rgba(5,12,10,0.96); color: white; }
    #loading-screen.active { display: flex; }
    .loading-panel { width: min(460px, 82vw); text-align: center; }
    .loading-panel h2 { margin: 0 0 22px; font-size: clamp(1.5rem, 4vw, 2.2rem); letter-spacing: 0.08em; }
    .loading-status { min-height: 1.5em; margin-bottom: 12px; color: rgba(255,255,255,0.78); font-size: 14px; }
    .loading-bar-bg { width: 100%; height: 16px; overflow: hidden; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.3); border-radius: 99px; }
    #loading-progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #3fbd70, #b9df63); transition: width 0.2s ease; }
    #loading-progress-value { margin-top: 10px; font-size: 13px; color: rgba(255,255,255,0.7); }
    .start-panel { width: min(560px, 86vw); background: rgba(10,15,20,0.86); border: 1px solid rgba(255,255,255,0.2); border-radius: 18px; padding: 32px 28px; box-shadow: 0 25px 60px rgba(0,0,0,0.45); color: white; text-align: center; }
    .start-panel h1 { margin: 0 0 12px; font-size: clamp(2rem, 4vw, 3rem); letter-spacing: 0.08em; }
    .start-panel p { margin: 0 0 20px; line-height: 1.7; color: rgba(255,255,255,0.82); }
    #start-button { appearance: none; border: none; border-radius: 999px; padding: 16px 28px; font-size: 1.1rem; font-weight: 700; background: linear-gradient(135deg, #4ecdc4, #5b8cff); color: white; cursor: pointer; box-shadow: 0 10px 24px rgba(91,140,255,0.45); transition: transform 0.15s ease, box-shadow 0.15s ease; }
    #start-button:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(91,140,255,0.6); }
  </style>
  <script type="module" crossorigin src="/assets/index-D1rv0oDC.js"></script>
</head>
<body>
  <div id="start-screen">
    <div class="start-panel">
      <h1>SurvivalGame</h1>
      <p>5つの島で資源を集め、建築し、食料と装備を整えながら領地を広げていくサバイバルゲームです。<br>ゲームを開始して、最初の島に降り立ちましょう。</p>
      <button id="start-button">ゲーム開始</button>
    </div>
  </div>
  <div id="loading-screen" aria-live="polite">
    <div class="loading-panel">
      <h2>読み込み中</h2>
      <div id="loading-status" class="loading-status">ゲームデータを準備しています</div>
      <div class="loading-bar-bg"><div id="loading-progress-bar"></div></div>
      <div id="loading-progress-value">0%</div>
    </div>
  </div>
  <div id="location-ui">現在地: <span id="island-name">グリーンアイランド</span></div>
  <div id="view-mode-ui">視点: <span id="view-mode-text">三人称</span> (Yで切替) / Mでマップ</div>
  <div id="ui-container">
    <div class="status-bar-container">HEALTH: <span id="hp-val">100</span> / 100<div class="bar-bg"><div id="hp-bar" class="bar-fill"></div></div></div>
    <div class="status-bar-container">WATER: <span id="thirst-val">100</span> / 100<div class="bar-bg"><div id="thirst-val-bar" class="bar-fill"></div></div></div>
    <div class="status-bar-container">FOOD: <span id="hunger-val">100</span> / 100<div class="bar-bg"><div id="hunger-bar" class="bar-fill"></div></div></div>
  </div>
  <div id="hotbar-container"></div>
  <div id="interact-prompt">[左クリック] 採集する</div>
  <div id="inventory-modal">
    <div class="panel">
      <div class="panel-title">INVENTORY (15)</div>
      <div class="inventory-grid" id="inventory-grid"></div>
    </div>
    <div class="panel">
      <div class="panel-title">CRAFTING (レシピ一覧)</div>
      <div class="craft-list" id="craft-list"></div>
    </div>
  </div>
  <div id="map-modal">
    <div id="map-title">MAP (Mで閉じる)</div>
    <canvas id="map-canvas" width="668" height="640"></canvas>
  </div>
</body>
</html>
